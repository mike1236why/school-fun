<!DOCTYPE html>
<html>
<head>
    <title>Eaglercraft Singleplayer</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Core Eaglercraft Singleplayer Web Engine -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/eag-web-sp@1.0.4/classes1_mod.js"></script>
    
    <style type="text/css">
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }
        #game_canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- The game renders directly into the body using the loaded scripts -->
    <script type="text/html" id="assets_script">
        /* Custom asset configurations or resource packs can be specified here if self-hosting */
    </script>

    <script type="text/javascript">
        // Event listener to kickstart the integrated singleplayer server once assets load
        window.addEventListener("load", function() {
            if (typeof main === "function") {
                console.log("Starting Eaglercraft Singleplayer...");
                // Initialize Eaglercraft engine
                // Note: Heavy assets load asynchronously into your browser's local storage/indexedDB
            } else {
                document.body.innerHTML = "<div style='color:white;padding:20px;'>Failed to load Eaglercraft engine components. Check your internet connection or CDN availability.</div>";
            }
        });
    </script>
</body>
</html>
